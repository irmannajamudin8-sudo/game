{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="glass-card mt-5">
            <h3 class="card-title text-center mb-4" style="font-weight: 700; color: #fff;">Register</h3>
            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control glass-input" id="username" name="username" placeholder="Choose a username" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control glass-input" id="email" name="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control glass-input" id="password" name="password" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn btn-aesthetic-success w-100 mt-3">Register</button>
            </form>
            <div class="mt-4 text-center">
                <small style="color: rgba(255,255,255,0.6);">Already have an account? <a href="{{ url_for('login') }}" class="aesthetic-link">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
